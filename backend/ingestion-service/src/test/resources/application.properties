# Test-only overrides. Tests must never touch the dev data/logmonitor.mv.db
# file -- a pure in-memory DB keeps test runs isolated and repeatable, and
# lets tests run in parallel with a locally-running dev server.
#
# NOTE: this file fully replaces src/main/resources/application.properties
# on the test classpath (it doesn't merge with it), so anything from there
# that still matters for tests has to be repeated here.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
