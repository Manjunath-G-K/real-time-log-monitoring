spring.application.name=ingestion-service
server.port=8081

# File-backed H2 (not spring.datasource.url=jdbc:h2:mem:...) so log data
# actually survives a restart -- an in-memory DB here would just be the
# old InMemoryLogStore with extra steps. AUTO_SERVER lets the H2 console
# or another tool attach to the same file concurrently for debugging.
spring.datasource.url=jdbc:h2:file:./data/logmonitor;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 'update' auto-generates/adjusts tables from the @Entity classes -- fine
# for a single-developer project at this stage, but it's not how you'd
# manage schema changes on a real team (that's what a migration tool like
# Flyway is for, tracked as a later improvement).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable Open Session In View: without this, Spring keeps the JPA
# session open for the entire HTTP request (including view rendering),
# which makes it easy to accidentally trigger lazy-loading queries deep
# in a controller instead of in the service layer where they're visible.
spring.jpa.open-in-view=false
